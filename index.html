<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood - Calm Drink Fishing 🎣</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #090d16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-card {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #1e293b 0%, #0369a1 25%, #0284c7 60%, #0c4a6e 100%);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            border: 3px solid #38bdf8;
        }

        /* Напис Calm Drink */
        .brand-header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .brand-title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fef08a;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6), 0 0 20px rgba(254, 240, 138, 0.5);
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #e0f2fe;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* Лічильник */
        .score-box {
            position: absolute;
            top: 90px;
            left: 20px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            color: #f8fafc;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .hint {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: #bae6fd;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="brand-header">
            <div class="brand-title">Calm Drink</div>
            <div class="brand-subtitle">UNDERWOOD BREWERY</div>
        </div>

        <div class="score-box">
            Спіймано: <span id="score">0</span> 🥫
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="hint">Клікай у воду, щоб кинути поплавок та виловити банку!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        let width, height;
        let score = 0;

        function resize() {
            width = canvas.width = canvas.parentElement.clientWidth;
            height = canvas.height = canvas.parentElement.clientHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Стилі баночок Underwood Calm Drink
        const canVariants = [
            { label: "CALM", sub: "IPA", color: "#f59e0b", accent: "#fbbf24" },
            { label: "CALM", sub: "BERRY", color: "#ec4899", accent: "#f472b6" },
            { label: "CALM", sub: "LAGER", color: "#10b981", accent: "#34d399" },
            { label: "CALM", sub: "STOUT", color: "#8b5cf6", accent: "#a78bfa" }
        ];

        class FloatingCan {
            constructor() {
                this.reset();
            }

            reset() {
                const style = canVariants[Math.floor(Math.random() * canVariants.length)];
                this.label = style.label;
                this.sub = style.sub;
                this.color = style.color;
                this.accent = style.accent;

                this.w = 26;
                this.h = 44;
                
                // Спавн тільки у воді (нижня частина екрану)
                this.x = Math.random() * (width - 80) + 40;
                this.y = Math.random() * (height - 350) + 240;

                // Хаотична швидкість руху
                this.vx = (Math.random() - 0.5) * 1.6;
                this.vy = (Math.random() - 0.5) * 1.0;

                // Кут нахилу та дрейф на хвилях
                this.angle = (Math.random() - 0.5) * 0.4;
                this.waveOffset = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.01;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Дрейф на хвилях
                this.waveOffset += 0.04;
                this.y += Math.sin(this.waveOffset) * 0.3;
                this.angle += this.rotationSpeed;

                // Відштовхування від меж води
                if (this.x < 30 || this.x > width - 30) this.vx *= -1;
                if (this.y < 220 || this.y > height - 50) this.vy *= -1;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Тінь у воді
                ctx.beginPath();
                ctx.ellipse(0, this.h / 2 + 4, this.w / 1.2, 5, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(3, 105, 161, 0.5)";
                ctx.fill();

                // Корпус банки
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(-this.w / 2, -this.h / 2, this.w, this.h, 5);
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // Кришка банки (металева)
                ctx.fillStyle = "#cbd5e1";
                ctx.fillRect(-this.w / 2 + 2, -this.h / 2 - 3, this.w - 4, 3);

                // Етикетка Calm Drink
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.fillRect(-this.w / 2 + 2, -this.h / 6, this.w - 4, 16);

                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 7px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("CALM", 0, -1);
                ctx.font = "bold 5px sans-serif";
                ctx.fillStyle = this.color;
                ctx.fillText(this.sub, 0, 8);

                ctx.restore();
            }
        }

        // Початкові баночки
        const cans = Array.from({ length: 6 }, () => new FloatingCan());

        // Механіка вудки
        const hook = {
            x: width / 2,
            y: 120,
            targetX: width / 2,
            targetY: 120,
            active: false,
            speed: 10
        };

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (clickY > 180) {
                hook.targetX = clickX;
                hook.targetY = clickY;
                hook.active = true;
            }
        });

        function updateHook() {
            if (hook.active) {
                const dx = hook.targetX - hook.x;
                const dy = hook.targetY - hook.y;
                const dist = Math.hypot(dx, dy);

                if (dist > hook.speed) {
                    hook.x += (dx / dist) * hook.speed;
                    hook.y += (dy / dist) * hook.speed;
                } else {
                    hook.x = hook.targetX;
                    hook.y = hook.targetY;

                    checkCollision();

                    // Повернення
                    setTimeout(() => {
                        hook.targetX = width / 2;
                        hook.targetY = 120;
                        hook.active = false;
                    }, 250);
                }
            } else {
                hook.x += (width / 2 - hook.x) * 0.1;
                hook.y += (120 - hook.y) * 0.1;
            }
        }

        function checkCollision() {
            cans.forEach(can => {
                const dist = Math.hypot(hook.x - can.x, hook.y - can.y);
                if (dist < 28) {
                    score++;
                    scoreEl.innerText = score;
                    can.reset();
                }
            });
        }

        let waveTime = 0;
        function renderWater() {
            waveTime += 0.03;
            ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 200 + i * 160);
                for (let x = 0; x <= width; x += 30) {
                    ctx.lineTo(x, 200 + i * 160 + Math.sin(x * 0.02 + waveTime + i) * 8);
                }
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.fill();
            }
        }

        function renderFishingLine() {
            // Волосінь від вудки
            ctx.beginPath();
            ctx.moveTo(width / 2, 0);
            ctx.lineTo(hook.x, hook.y);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Поплавок
            ctx.beginPath();
            ctx.arc(hook.x, hook.y - 6, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#ef4444";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(hook.x, hook.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            renderWater();

            cans.forEach(can => {
                can.update();
                can.draw();
            });

            updateHook();
            renderFishingLine();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
