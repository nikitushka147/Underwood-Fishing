<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calm Drink - Fishing Game 🎣</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 35%, #0369a1 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 4px solid #0284c7;
        }

        /* Напис Calm Drink */
        .brand-header {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fef08a;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), 0 0 15px rgba(254, 240, 138, 0.6);
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #e0f2fe;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Статистика */
        .score-board {
            position: absolute;
            top: 75px;
            left: 15px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Підказка */
        .instructions {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: #bae6fd;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="brand-header">
            <div class="brand-title">Calm Drink</div>
            <div class="brand-subtitle">Крафтова Риболовля 🌊</div>
        </div>

        <div class="score-board">
            Спіймано напоїв: <span id="score">0</span> 🥫
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="instructions">Закидай вудку, щоб виловити баночки!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        let width, height;
        let score = 0;

        // Налаштування розмірів
        function resize() {
            width = canvas.width = canvas.parentElement.clientWidth;
            height = canvas.height = canvas.parentElement.clientHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Типи баночок / напоїв Calm Drink
        const drinkTypes = [
            { name: "Lager Can", color: "#f59e0b", label: "🍺", radius: 18 },
            { name: "IPA Can", color: "#10b981", label: "🌿", radius: 18 },
            { name: "Berry Bottle", color: "#ec4899", label: "🍓", radius: 16 },
            { name: "Citrus Can", color: "#ef4444", label: "🍊", radius: 18 }
        ];

        // Масив баночок у воді
        const drinks = [];
        const maxDrinks = 6;

        class FloatingDrink {
            constructor() {
                this.reset();
            }

            reset() {
                const type = drinkTypes[Math.floor(Math.random() * drinkTypes.length)];
                this.color = type.color;
                this.label = type.label;
                this.radius = type.radius;
                
                this.x = Math.random() * (width - 60) + 30;
                this.y = Math.random() * (height - 350) + 200; // Положення у воді
                
                // Хаотична швидкість
                this.vx = (Math.random() - 0.5) * 1.8;
                this.vy = (Math.random() - 0.5) * 1.2;
                
                // Для плавного коливання
                this.waveAngle = Math.random() * Math.PI * 2;
                this.waveSpeed = 0.03 + Math.random() * 0.02;
            }

            update() {
                // Рух по хаотичній траєкторії
                this.x += this.vx;
                this.y += this.vy;

                // Легке хвилеподібне коливання
                this.waveAngle += this.waveSpeed;
                this.y += Math.sin(this.waveAngle) * 0.4;

                // Відштовхування від стінок
                if (this.x - this.radius < 15 || this.x + this.radius > width - 15) {
                    this.vx *= -1;
                }
                if (this.y - this.radius < 180 || this.y + this.radius > height - 40) {
                    this.vy *= -1;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Тінь під баночкою на воді
                ctx.beginPath();
                ctx.ellipse(0, this.radius + 2, this.radius * 0.9, 6, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(2, 132, 199, 0.4)";
                ctx.fill();

                // Корпус баночки
                ctx.beginPath();
                ctx.roundRect(-this.radius * 0.7, -this.radius, this.radius * 1.4, this.radius * 2, 6);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // Блік світла
                ctx.beginPath();
                ctx.rect(-this.radius * 0.5, -this.radius + 3, 3, this.radius * 1.6);
                ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                ctx.fill();

                // Іконка напою
                ctx.font = "12px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.label, 0, 0);

                ctx.restore();
            }
        }

        // Спавн початкових баночок
        for (let i = 0; i < maxDrinks; i++) {
            drinks.push(new FloatingDrink());
        }

        // Вудка та волосінь
        const rod = {
            x: width / 2,
            y: 50,
            hookX: width / 2,
            hookY: 120,
            targetX: width / 2,
            targetY: 120,
            isCasting: false,
            speed: 8
        };

        // Обробка кліку для закидання
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Закидаємо лише якщо клік у воду
            if (clickY > 150) {
                rod.targetX = clickX;
                rod.targetY = clickY;
                rod.isCasting = true;
            }
        });

        // Головний ігровий цикл
        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            // Малювання водяних хвиль / фону
            drawWaterWaves();

            // Оновлення та малювання баночок
            drinks.forEach(drink => {
                drink.update();
                drink.draw();
            });

            // Оновлення вудки
            updateHook();

            // Малювання волосіні та гачка
            drawFishingRod();

            requestAnimationFrame(gameLoop);
        }

        let waveOffset = 0;
        function drawWaterWaves() {
            waveOffset += 0.03;
            ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 180 + i * 180);
                for (let x = 0; x <= width; x += 20) {
                    ctx.lineTo(x, 180 + i * 180 + Math.sin(x * 0.02 + waveOffset + i) * 6);
                }
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.fill();
            }
        }

        function updateHook() {
            if (rod.isCasting) {
                const dx = rod.targetX - rod.hookX;
                const dy = rod.targetY - rod.hookY;
                const dist = Math.hypot(dx, dy);

                if (dist > rod.speed) {
                    rod.hookX += (dx / dist) * rod.speed;
                    rod.hookY += (dy / dist) * rod.speed;
                } else {
                    rod.hookX = rod.targetX;
                    rod.hookY = rod.targetY;

                    // Перевірка на ловлю баночки
                    checkCatch();

                    // Повернення гачка
                    setTimeout(() => {
                        rod.targetX = width / 2;
                        rod.targetY = 120;
                        rod.isCasting = false;
                    }, 300);
                }
            } else {
                // Плавне повернення гачка до початкового стану
                rod.hookX += (width / 2 - rod.hookX) * 0.1;
                rod.hookY += (120 - rod.hookY) * 0.1;
            }
        }

        function checkCatch() {
            for (let i = 0; i < drinks.length; i++) {
                const drink = drinks[i];
                const dist = Math.hypot(rod.hookX - drink.x, rod.hookY - drink.y);

                if (dist < drink.radius + 15) {
                    // Спіймано!
                    score++;
                    scoreEl.innerText = score;

                    // Респавн баночки
                    drink.reset();
                    break;
                }
            }
        }

        function drawFishingRod() {
            // Волосінь
            ctx.beginPath();
            ctx.moveTo(width / 2, 40);
            ctx.lineTo(rod.hookX, rod.hookY);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Гачок
            ctx.save();
            ctx.translate(rod.hookX, rod.hookY);
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI);
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        // Запуск
        gameLoop();
    </script>
</body>
</html>
