<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood Calm Fishing 🎣🥤</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #0d1b2a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 650px;
            background: linear-gradient(180deg, #87ceeb 0%, #1e3c72 30%, #001845 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            border: 4px solid #415a77;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        /* Табло */
        .scoreboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 27, 42, 0.85);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #778da9;
            z-index: 10;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Човен і вудка */
        .boat-wrapper {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        .boat {
            font-size: 3rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Леска та гачок */
        .fishing-line {
            position: absolute;
            top: 125px;
            left: 50%;
            width: 2px;
            background: rgba(255, 255, 255, 0.8);
            height: 0px;
            transform: translateX(-50%);
            z-index: 4;
            transition: height 0.05s linear;
        }

        .hook {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            line-height: 1;
        }

        /* Вода та бульбашки */
        .water-line {
            position: absolute;
            top: 140px;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Банка Calm Drink */
        .can {
            position: absolute;
            width: 32px;
            height: 60px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            font-size: 0.55rem;
            font-weight: bold;
            color: #000;
            text-align: center;
            padding: 2px;
            transition: left 0.05s linear;
        }

        .can::before {
            content: '';
            position: absolute;
            top: -3px;
            width: 24px;
            height: 3px;
            background: #d1d5db;
            border-radius: 2px 2px 0 0;
        }

        /* Смаки банок */
        .can-mango {
            background: linear-gradient(180deg, #fff7ad 0%, #ffd000 100%);
        }
        .can-cola {
            background: #111111;
            color: #ffffff;
            border-color: #444;
        }
        .can-bergamot {
            background: linear-gradient(180deg, #fce4ec 0%, #f48fb1 100%);
        }
        .can-orange {
            background: linear-gradient(180deg, #ffe0b2 0%, #ff9800 100%);
        }

        .can-label {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.5rem;
        }

        /* Екран Перемоги */
        .win-card {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(13, 27, 42, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            z-index: 20;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .win-card h2 {
            font-size: 2rem;
            color: #ffb703;
            margin-bottom: 10px;
        }

        .win-card p {
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.4;
            color: #e0e1dd;
        }

        .buy-btn {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #023047;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(251, 133, 0, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .buy-btn:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameArea">
        <div class="scoreboard">Виловлено Calm Drink: <span id="score">0</span> / 4 🥤</div>

        <div class="water-line"></div>

        <div class="boat-wrapper">
            <div class="boat">🚣‍♂️</div>
        </div>

        <div class="fishing-line" id="line">
            <div class="hook">🪝</div>
        </div>

        <div class="win-card" id="winCard">
            <h2>ЧУДОВИЙ УЛОВ! 🧘‍♂️🥤</h2>
            <p>Ти виловив усі 4 смаки релаксуючого Calm Drink! Час відчути дззен та спробувати серію Wellness:</p>
            <a href="https://underwood.beer/product/calm-taster-box/" target="_blank" class="buy-btn">Замовити Calm Drink 🛒</a>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const line = document.getElementById('line');
        const scoreEl = document.getElementById('score');
        const winCard = document.getElementById('winCard');

        const canTypes = [
            { id: 'mango', name: 'Mango x Pineapple', class: 'can-mango' },
            { id: 'cola', name: 'Cola', class: 'can-cola' },
            { id: 'bergamot', name: 'Bergamot x Hibiscus', class: 'can-bergamot' },
            { id: 'orange', name: 'Orange x Chili', class: 'can-orange' }
        ];

        let activeCans = [];
        let caughtCount = 0;
        let isFishing = false;
        let lineY = 0;
        let fishingInterval = null;
        let caughtCan = null;

        // Спавн банок під водою
        function spawnCans() {
            canTypes.forEach((type, index) => {
                const can = document.createElement('div');
                can.className = `can ${type.class}`;
                can.innerHTML = `<span class="can-label">calm</span>`;
                
                const depth = 220 + index * 95;
                const speed = (Math.random() * 1.5 + 1) * (Math.random() < 0.5 ? 1 : -1);
                const x = Math.random() * 320 + 20;

                can.style.top = `${depth}px`;
                can.style.left = `${x}px`;

                gameArea.appendChild(can);

                activeCans.push({
                    element: can,
                    type: type,
                    x: x,
                    y: depth,
                    speed: speed,
                    caught: false
                });
            });
        }

        // Анімація руху банок вліво-вправо
        function updateCans() {
            activeCans.forEach(can => {
                if (!can.caught) {
                    can.x += can.speed;
                    if (can.x <= 10 || can.x >= 390) {
                        can.speed *= -1;
                    }
                    can.element.style.left = `${can.x}px`;
                } else if (caughtCan === can) {
                    // Якщо банка на гачку — вона слідує за гачком
                    can.element.style.top = `${125 + lineY}px`;
                    can.element.style.left = `calc(50% - 16px)`;
                }
            });
        }

        setInterval(updateCans, 30);

        // Клік для опускання вудки
        gameArea.addEventListener('click', (e) => {
            if (isFishing || caughtCount >= 4) return;
            if (e.target.closest('#winCard')) return;

            isFishing = true;
            lineY = 0;
            caughtCan = null;

            // Опускання гачка
            fishingInterval = setInterval(() => {
                lineY += 6;
                line.style.height = `${lineY}px`;

                const hookY = 125 + lineY;

                // Перевірка зіткнення з банкою
                if (!caughtCan) {
                    activeCans.forEach(can => {
                        if (!can.caught && Math.abs(can.y - hookY) < 20 && Math.abs((can.x + 16) - 225) < 30) {
                            can.caught = true;
                            caughtCan = can;
                        }
                    });
                }

                // Досягли дна або спіймати банку — тягнемо назад
                if (lineY >= 480 || caughtCan) {
                    clearInterval(fishingInterval);
                    retractHook();
                }
            }, 20);
        });

        // Підйому гачка вгору
        function retractHook() {
            fishingInterval = setInterval(() => {
                lineY -= 8;
                line.style.height = `${lineY}px`;

                if (lineY <= 0) {
                    clearInterval(fishingInterval);
                    lineY = 0;
                    line.style.height = '0px';
                    isFishing = false;

                    if (caughtCan) {
                        gameArea.removeChild(caughtCan.element);
                        activeCans = activeCans.filter(c => c !== caughtCan);
                        caughtCan = null;
                        caughtCount++;
                        scoreEl.innerText = caughtCount;

                        if (caughtCount >= 4) {
                            setTimeout(() => {
                                winCard.style.display = 'flex';
                            }, 500);
                        }
                    }
                }
            }, 20);
        }

        spawnCans();
    </script>
</body>
</html>
