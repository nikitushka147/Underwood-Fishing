<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood Calm Drink Fishing 🎣🥤</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #0d1b2a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            height: 700px;
            background: linear-gradient(180deg, #87ceeb 0%, #1e3c72 30%, #001845 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            border: 4px solid #415a77;
            display: flex;
            flex-direction: column;
        }

        /* Табло */
        .scoreboard {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 27, 42, 0.85);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #778da9;
            z-index: 10;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        /* Човен і вудка */
        .boat-wrapper {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            transition: left 0.05s linear;
        }

        .boat {
            font-size: 3rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Леска та гачок */
        .fishing-line {
            position: absolute;
            top: 120px;
            left: 50%;
            width: 2px;
            background: rgba(255, 255, 255, 0.9);
            height: 0px;
            transform: translateX(-50%);
            z-index: 4;
        }

        .hook {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            line-height: 1;
        }

        /* Вода */
        .water-line {
            position: absolute;
            top: 135px;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Банка Calm Drink */
        .can {
            position: absolute;
            width: 36px;
            height: 64px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            font-size: 0.55rem;
            font-weight: bold;
            color: #000;
            text-align: center;
            padding: 2px;
            pointer-events: none;
        }

        .can::before {
            content: '';
            position: absolute;
            top: -3px;
            width: 26px;
            height: 3px;
            background: #d1d5db;
            border-radius: 2px 2px 0 0;
        }

        /* Смаки банок */
        .can-mango {
            background: linear-gradient(180deg, #fff7ad 0%, #ffd000 100%);
        }
        .can-cola {
            background: #111111;
            color: #ffffff;
            border-color: #555;
        }
        .can-bergamot {
            background: linear-gradient(180deg, #fce4ec 0%, #f48fb1 100%);
        }
        .can-orange {
            background: linear-gradient(180deg, #ffe0b2 0%, #ff9800 100%);
        }

        .can-label {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.52rem;
            font-weight: 800;
            line-height: 1;
        }

        /* Панель кнопок керування */
        .controls-bar {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 15;
        }

        .ctrl-btn {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: 2px solid #778da9;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: #ffb703;
            color: #0d1b2a;
            transform: scale(0.95);
        }

        .cast-btn {
            flex-grow: 1;
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #023047;
            border-color: #ffe0b2;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        /* Екран Перемоги */
        .win-card {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(13, 27, 42, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            z-index: 20;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .win-card h2 {
            font-size: 2rem;
            color: #ffb703;
            margin-bottom: 10px;
        }

        .win-card p {
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.4;
            color: #e0e1dd;
        }

        .buy-btn {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #023047;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(251, 133, 0, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .buy-btn:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameArea">
        <div class="scoreboard">Виловлено Calm Drink: <span id="score">0</span> / 4 🥤</div>

        <div class="water-line"></div>

        <div class="boat-wrapper" id="boatWrapper">
            <div class="boat">🚣‍♂️</div>
        </div>

        <div class="fishing-line" id="line">
            <div class="hook">🪝</div>
        </div>

        <div class="win-card" id="winCard">
            <h2>ЧУДОВИЙ УЛОВ! 🧘‍♂️🥤</h2>
            <p>Ти виловив усі 4 смаки релаксуючого Calm Drink! Час відчути дзен та спробувати серію Wellness:</p>
            <a href="https://underwood.beer/product-category/wellness/" target="_blank" class="buy-btn">Замовити Calm Drink 🛒</a>
        </div>

        <div class="controls-bar">
            <button class="ctrl-btn" id="btnLeft">◀</button>
            <button class="ctrl-btn cast-btn" id="btnCast">🎣 Рибалити</button>
            <button class="ctrl-btn" id="btnRight">▶</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const boatWrapper = document.getElementById('boatWrapper');
        const line = document.getElementById('line');
        const scoreEl = document.getElementById('score');
        const winCard = document.getElementById('winCard');

        const canTypes = [
            { id: 'mango', name: 'Mango x Pineapple', class: 'can-mango' },
            { id: 'cola', name: 'Cola', class: 'can-cola' },
            { id: 'bergamot', name: 'Bergamot x Hibiscus', class: 'can-bergamot' },
            { id: 'orange', name: 'Orange x Chili', class: 'can-orange' }
        ];

        let activeCans = [];
        let caughtCount = 0;
        let isFishing = false;
        let lineY = 0;
        let fishingInterval = null;
        let caughtCan = null;

        // Позиція човна
        let boatX = 225; // центр gameArea (450px / 2)
        const minBoatX = 40;
        const maxBoatX = 410;
        let moveDir = 0;

        function updateBoatPosition() {
            if (moveDir !== 0) {
                boatX += moveDir * 4;
                if (boatX < minBoatX) boatX = minBoatX;
                if (boatX > maxBoatX) boatX = maxBoatX;

                boatWrapper.style.left = `${boatX}px`;
                if (!isFishing) {
                    line.style.left = `${boatX}px`;
                }
            }
            requestAnimationFrame(updateBoatPosition);
        }
        updateBoatPosition();

        // Кнопки керування
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnCast = document.getElementById('btnCast');

        btnLeft.addEventListener('mousedown', () => moveDir = -1);
        btnLeft.addEventListener('mouseup', () => moveDir = 0);
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveDir = -1; });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); moveDir = 0; });

        btnRight.addEventListener('mousedown', () => moveDir = 1);
        btnRight.addEventListener('mouseup', () => moveDir = 0);
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveDir = 1; });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); moveDir = 0; });

        btnCast.addEventListener('click', startFishing);

        // Керування клавіатурою
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'А') moveDir = -1;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'В') moveDir = 1;
            if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's') startFishing();
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'a', 'А', 'ArrowRight', 'd', 'В'].includes(e.key)) moveDir = 0;
        });

        // Спавн банок під водою
        function spawnCans() {
            canTypes.forEach((type, index) => {
                const can = document.createElement('div');
                can.className = `can ${type.class}`;
                // ЧІТКИЙ НАПИС CALM DRINK
                can.innerHTML = `<span class="can-label">CALM DRINK</span>`;
                
                const depth = 200 + index * 90;
                const x = Math.random() * 340 + 30;

                can.style.top = `${depth}px`;
                can.style.left = `${x}px`;

                gameArea.appendChild(can);

                activeCans.push({
                    element: can,
                    type: type,
                    x: x,
                    y: depth,
                    baseY: depth,
                    angle: Math.random() * Math.PI * 2,
                    speedX: (Math.random() * 1.5 + 0.8) * (Math.random() < 0.5 ? 1 : -1),
                    speedY: Math.random() * 0.8 + 0.3,
                    changeDirTimer: Math.random() * 60 + 30,
                    caught: false
                });
            });
        }

        // ХАОТИЧНИЙ РУХ БАНОЧОК
        function updateCans() {
            activeCans.forEach(can => {
                if (!can.caught) {
                    // Хаотична зміна напрямку
                    can.changeDirTimer--;
                    if (can.changeDirTimer <= 0) {
                        can.speedX += (Math.random() - 0.5) * 1.2;
                        can.speedY += (Math.random() - 0.5) * 0.6;
                        // Обмеження швидкості
                        can.speedX = Math.max(-2.2, Math.min(2.2, can.speedX));
                        can.speedY = Math.max(-1, Math.min(1, can.speedY));
                        can.changeDirTimer = Math.random() * 80 + 40;
                    }

                    can.x += can.speedX;
                    can.y += can.speedY;

                    // Коливання на хвилях
                    can.angle += 0.04;
                    const waveY = can.y + Math.sin(can.angle) * 4;

                    // Відбивання від стінок та меж глибини
                    if (can.x <= 15) { can.x = 15; can.speedX *= -1; }
                    if (can.x >= 395) { can.x = 395; can.speedX *= -1; }
                    if (can.y <= 170) { can.y = 170; can.speedY *= -1; }
                    if (can.y >= 540) { can.y = 540; can.speedY *= -1; }

                    can.element.style.left = `${can.x}px`;
                    can.element.style.top = `${waveY}px`;
                } else if (caughtCan === can) {
                    // Коли банка на гачку — вона тягнеться вгору разом із гачком
                    can.element.style.top = `${120 + lineY}px`;
                    can.element.style.left = `${boatX - 18}px`;
                }
            });
        }

        setInterval(updateCans, 30);

        // Опускання та підйом вудки
        function startFishing() {
            if (isFishing || caughtCount >= 4) return;

            isFishing = true;
            lineY = 0;
            caughtCan = null;
            line.style.left = `${boatX}px`;

            fishingInterval = setInterval(() => {
                lineY += 6;
                line.style.height = `${lineY}px`;

                const hookY = 120 + lineY;

                // Перевірка зіткнення з банкою
                if (!caughtCan) {
                    activeCans.forEach(can => {
                        if (!can.caught && Math.abs(can.y - hookY) < 22 && Math.abs((can.x + 18) - boatX) < 28) {
                            can.caught = true;
                            caughtCan = can;
                        }
                    });
                }

                // Досягли дна або спіймали банку — тягнемо назад
                if (lineY >= 430 || caughtCan) {
                    clearInterval(fishingInterval);
                    retractHook();
                }
            }, 20);
        }

        function retractHook() {
            fishingInterval = setInterval(() => {
                lineY -= 8;
                line.style.height = `${lineY}px`;

                if (lineY <= 0) {
                    clearInterval(fishingInterval);
                    lineY = 0;
                    line.style.height = '0px';
                    isFishing = false;

                    if (caughtCan) {
                        gameArea.removeChild(caughtCan.element);
                        activeCans = activeCans.filter(c => c !== caughtCan);
                        caughtCan = null;
                        caughtCount++;
                        scoreEl.innerText = caughtCount;

                        if (caughtCount >= 4) {
                            setTimeout(() => {
                                winCard.style.display = 'flex';
                            }, 500);
                        }
                    }
                }
            }, 20);
        }

        spawnCans();
    </script>
</body>
</html>
