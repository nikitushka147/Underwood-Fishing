<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood Calm Drink Fishing 🎣</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #090d16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-card {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #1e293b 0%, #0369a1 22%, #0284c7 55%, #0c4a6e 100%);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            border: 3px solid #38bdf8;
            display: flex;
            flex-direction: column;
        }

        /* Напис бренду */
        .brand-header {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fef08a;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.7), 0 0 18px rgba(254, 240, 138, 0.6);
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: #bae6fd;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Лічильник */
        .score-box {
            position: absolute;
            top: 85px;
            left: 15px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid rgba(56, 189, 248, 0.4);
            z-index: 10;
            color: #f8fafc;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Панель керування рибалкою */
        .controls-panel {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }

        .btn-ctrl {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 2px solid #38bdf8;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.1s, background 0.2s;
            touch-action: manipulation;
        }

        .btn-ctrl:active {
            transform: scale(0.92);
            background: #f59e0b;
        }

        .btn-cast {
            flex-grow: 1;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-color: #fef08a;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hint {
            position: absolute;
            top: 118px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #e0f2fe;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="brand-header">
            <div class="brand-title">CALM DRINK</div>
            <div class="brand-subtitle">UNDERWOOD BREWERY</div>
        </div>

        <div class="score-box">
            Спіймано: <span id="score">0</span> 🥫
        </div>

        <div class="hint">Кнопками або стрілками рухай рибалку & кидай гачок!</div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls-panel">
            <button class="btn-ctrl" id="btnLeft">◀</button>
            <button class="btn-ctrl btn-cast" id="btnCast">🎣 КИДАТИ</button>
            <button class="btn-ctrl" id="btnRight">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        let width, height;
        let score = 0;

        function resize() {
            width = canvas.width = canvas.parentElement.clientWidth;
            height = canvas.height = canvas.parentElement.clientHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Позиція та рух Рибалки
        const fisherman = {
            x: width / 2,
            y: 110,
            speed: 5,
            dir: 0, // -1 вліво, 1 вправо
            size: 28
        };

        // Гачок
        const hook = {
            x: width / 2,
            y: 110,
            targetX: width / 2,
            targetY: 110,
            active: false,
            speed: 8
        };

        // Баночки Calm Drink Underwood
        const canVariants = [
            { flavor: "IPA", color: "#f59e0b", accent: "#fef08a" },
            { flavor: "BERRY", color: "#ec4899", accent: "#fbcfe8" },
            { flavor: "LAGER", color: "#10b981", accent: "#a7f3d0" },
            { flavor: "STOUT", color: "#8b5cf6", accent: "#ddd6fe" }
        ];

        class FloatingCan {
            constructor() {
                this.reset();
            }

            reset() {
                const style = canVariants[Math.floor(Math.random() * canVariants.length)];
                this.flavor = style.flavor;
                this.color = style.color;
                this.accent = style.accent;

                this.w = 28;
                this.h = 46;

                // Початкова позиція у водній товщі
                this.x = Math.random() * (width - 60) + 30;
                this.y = Math.random() * (height - 320) + 220;

                // Хаотичний рух з випадковим напрямком
                this.speed = Math.random() * 1.2 + 0.6;
                this.moveAngle = Math.random() * Math.PI * 2;
                this.changeDirTimer = Math.random() * 100 + 50;

                // Дрейф на хвилях та похитування
                this.tiltAngle = (Math.random() - 0.5) * 0.4;
                this.waveOffset = Math.random() * Math.PI * 2;
            }

            update() {
                // Хаотична зміна напрямку руху
                this.changeDirTimer--;
                if (this.changeDirTimer <= 0) {
                    this.moveAngle += (Math.random() - 0.5) * 1.5;
                    this.changeDirTimer = Math.random() * 120 + 40;
                }

                // Переміщення
                this.x += Math.cos(this.moveAngle) * this.speed;
                this.y += Math.sin(this.moveAngle) * this.speed;

                // Дрейф від хвиль
                this.waveOffset += 0.05;
                this.y += Math.sin(this.waveOffset) * 0.35;
                this.tiltAngle = Math.sin(this.waveOffset * 0.5) * 0.2;

                // Відбивання від меж водної гладі
                if (this.x < 25) { this.x = 25; this.moveAngle = Math.PI - this.moveAngle; }
                if (this.x > width - 25) { this.x = width - 25; this.moveAngle = Math.PI - this.moveAngle; }
                if (this.y < 200) { this.y = 200; this.moveAngle = -this.moveAngle; }
                if (this.y > height - 90) { this.y = height - 90; this.moveAngle = -this.moveAngle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.tiltAngle);

                // Тінь банки у воді
                ctx.beginPath();
                ctx.ellipse(0, this.h / 2 + 5, this.w / 1.1, 5, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(3, 105, 161, 0.4)";
                ctx.fill();

                // Корпус банки
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(-this.w / 2, -this.h / 2, this.w, this.h, 6);
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // Металеві верхівок і денце
                ctx.fillStyle = "#e2e8f0";
                ctx.fillRect(-this.w / 2 + 2, -this.h / 2 - 2, this.w - 4, 3);
                ctx.fillRect(-this.w / 2 + 3, this.h / 2 - 1, this.w - 6, 2);

                // Біла етикетка з ЧІТКИМ НАПИСОМ CALM DRINK
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-this.w / 2 + 2, -this.h / 5, this.w - 4, 18);

                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 6px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("CALM DRINK", 0, -2);

                ctx.font = "900 5px sans-serif";
                ctx.fillStyle = this.color;
                ctx.fillText(this.flavor, 0, 7);

                ctx.restore();
            }
        }

        const cans = Array.from({ length: 7 }, () => new FloatingCan());

        // Керування кнопками
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnCast = document.getElementById('btnCast');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); fisherman.dir = -1; });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); fisherman.dir = 0; });
        btnLeft.addEventListener('mousedown', () => fisherman.dir = -1);
        btnLeft.addEventListener('mouseup', () => fisherman.dir = 0);

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); fisherman.dir = 1; });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); fisherman.dir = 0; });
        btnRight.addEventListener('mousedown', () => fisherman.dir = 1);
        btnRight.addEventListener('mouseup', () => fisherman.dir = 0);

        function castHook() {
            if (!hook.active) {
                hook.targetX = fisherman.x;
                hook.targetY = Math.random() * (height - 350) + 260;
                hook.active = true;
            }
        }

        btnCast.addEventListener('click', castHook);

        // Кліки по полотну
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (clickY > 170) {
                hook.targetX = clickX;
                hook.targetY = clickY;
                hook.active = true;
            }
        });

        // Клавіатура
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'А') fisherman.dir = -1;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'В') fisherman.dir = 1;
            if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's') castHook();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'А' ||
                e.key === 'ArrowRight' || e.key === 'd' || e.key === 'В') {
                fisherman.dir = 0;
            }
        });

        function updateFishermanAndHook() {
            // Рух рибалки
            fisherman.x += fisherman.dir * fisherman.speed;
            if (fisherman.x < 30) fisherman.x = 30;
            if (fisherman.x > width - 30) fisherman.x = width - 30;

            // Рух гачка
            if (hook.active) {
                const dx = hook.targetX - hook.x;
                const dy = hook.targetY - hook.y;
                const dist = Math.hypot(dx, dy);

                if (dist > hook.speed) {
                    hook.x += (dx / dist) * hook.speed;
                    hook.y += (dy / dist) * hook.speed;
                } else {
                    hook.x = hook.targetX;
                    hook.y = hook.targetY;
                    checkCollision();

                    setTimeout(() => {
                        hook.active = false;
                    }, 200);
                }
            } else {
                hook.x += (fisherman.x - hook.x) * 0.15;
                hook.y += (fisherman.y - hook.y) * 0.15;
            }
        }

        function checkCollision() {
            cans.forEach(can => {
                const dist = Math.hypot(hook.x - can.x, hook.y - can.y);
                if (dist < 30) {
                    score++;
                    scoreEl.innerText = score;
                    can.reset();
                }
            });
        }

        // Малювання рибалки та човна
        function drawFisherman() {
            ctx.save();
            ctx.translate(fisherman.x, fisherman.y);

            // Човен
            ctx.fillStyle = "#78350f";
            ctx.beginPath();
            ctx.ellipse(0, 5, 30, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#451a03";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Рибалка (силует/фігурка)
            ctx.fillStyle = "#fef08a";
            ctx.beginPath();
            ctx.arc(0, -12, 8, 0, Math.PI * 2); // Голова в капелюсі
            ctx.fill();

            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(-6, -4, 12, 10); // Тіло

            // Вудка
            ctx.strokeStyle = "#d97706";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(fisherman.dir >= 0 ? 24 : -24, -18);
            ctx.stroke();

            ctx.restore();
        }

        let waveTime = 0;
        function drawWater() {
            waveTime += 0.03;
            ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 170 + i * 170);
                for (let x = 0; x <= width; x += 25) {
                    ctx.lineTo(x, 170 + i * 170 + Math.sin(x * 0.02 + waveTime + i) * 6);
                }
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.fill();
            }
        }

        function drawLineAndHook() {
            const rodTipX = fisherman.x + (fisherman.dir >= 0 ? 24 : -24);
            const rodTipY = fisherman.y - 18;

            // Волосінь
            ctx.beginPath();
            ctx.moveTo(rodTipX, rodTipY);
            ctx.lineTo(hook.x, hook.y);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // Поплавок
            ctx.beginPath();
            ctx.arc(hook.x, hook.y - 4, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#ef4444";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(hook.x, hook.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            drawWater();
            drawFisherman();

            cans.forEach(can => {
                can.update();
                can.draw();
            });

            updateFishermanAndHook();
            drawLineAndHook();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
